name: deploy

# No test job here, deliberately. ci.yml runs on the pull request, and branch
# protection requires its three jobs to pass before master can be merged into --
# so master by definition only ever holds a commit this suite already went green
# on. Re-running lint/unit/e2e on the merge commit would be a second copy of the
# same run for the same tree; the PR run IS the deploy gate. bonnot's deploy.yml
# reached the same conclusion and dropped its duplicate on 2026-05-14.
#
# The consequence to know: a push that BYPASSES the pull-request gate (an admin
# override, or protection being switched off) deploys code nothing has tested.
# "Require a pull request before merging" on master is what closes that hole --
# it is load-bearing here, not hygiene.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # Builds on the runner, not on the school box. That is the point: it removes
  # the image build -- the RAM spike that makes 4 GB a real floor -- from every
  # box at once, and it is what lets a restore start the exact version a dump
  # came from rather than rebuilding it.
  #
  # In this workflow rather than a separate one: two workflows on the same
  # trigger would race, and the deploy must be strictly downstream of the push.
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags, both pushed every time. :master is the floating canary tag
      # libli.pl follows; :sha-<short> is immutable and is what a manifest
      # records -- a floating tag cannot pin a restore to a version.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/krzyssikora/libli:master
            ghcr.io/krzyssikora/libli:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    # Job-level rather than workflow-level, and cancel-in-progress: false. A
    # deploy interrupted between `migrate` and gunicorn leaves a half-applied
    # stack, which is worse than a queued run finishing late.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy to production
        id: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # appleboy/ssh-action defaults to a 10-minute command_timeout, and a
          # deploy legitimately exceeds it: pulling the multi-GB image over the
          # box's own link plus `--wait` on a healthcheck with start_period 60s
          # and 30 retries at 10s is over 10 minutes on its own. The default
          # does not fail the deploy cleanly -- it severs the SSH session
          # mid-pull and reports a timeout while the host carries on, so the
          # run is red and the site state is unknown.
          command_timeout: 30m
          # `set -e` is the FIRST line of the script below, not the action's
          # `script_stop` input. v1 (v1.2.5, wrapping drone-ssh 1.8.4) does not
          # accept script_stop: it logs "Unexpected input(s) 'script_stop'" as a
          # warning and ignores it. An ignored input is worse than no input --
          # it reads in review as protection that is not there, and the run goes
          # green either way, so nothing surfaces the gap.
          #
          # What it buys: drone-ssh runs the script as ONE remote shell (proven
          # here by `cd` on the first line governing the rest), and without
          # `set -e` that shell continues past a failure and reports only the
          # LAST command's status -- so a failed fetch would be followed by a
          # deploy against stale code, reported as success.
          # The reset lives here as well as inside deploy.sh, and the redundancy
          # is the point. It resolves a bootstrap that otherwise cannot start:
          # deploy.sh is what fetches the repo, so on a host whose checkout
          # predates it -- a fresh provision, or this one -- there is no
          # deploy.sh to run and the deploy dies on "No such file or directory".
          #
          # It also means `bash` reads the version of deploy.sh that this run
          # just fetched, rather than the one already on disk. Without that, a
          # change to deploy.sh would not take effect until the NEXT deploy,
          # which makes a broken change surface one merge away from its cause.
          #
          # deploy.sh keeps its own reset so that running it by hand on the box
          # (the rollback path in docs/deployment.md §8) is still correct on its
          # own. Re-running it here costs one no-op fetch.
          #
          # The retry: GitHub intermittently answers an ANONYMOUS fetch of this
          # PUBLIC repo with a 401 challenge, and git dies on "could not read
          # Username" for want of a tty. Three deploys died that way in two days
          # (#293, #295, #296) -- and #296 proves it is not the host's
          # credentials, because its FIRST fetch succeeded and the second was
          # refused 440 ms later. `exit 1` on exhaustion, never `break`: falling
          # through would reset to a stale origin/master and deploy it green.
          #
          # LIBLI_DEPLOY_SKIP_FETCH tells deploy.sh this fetch already happened,
          # so it resets without asking github.com a second time inside a second.
          # deploy.sh keeps its own fetch for the by-hand rollback path.
          script: |
            set -e
            cd /opt/libli
            for attempt in 1 2 3; do
              if git fetch origin master; then break; fi
              if [ "$attempt" -eq 3 ]; then
                echo "git fetch failed 3 times; refusing to deploy stale code" >&2
                exit 1
              fi
              echo "git fetch failed (attempt $attempt/3); retrying in 5s"
              sleep 5
            done
            git reset --hard origin/master
            LIBLI_DEPLOY_SKIP_FETCH=1 bash /opt/libli/deploy.sh

      # A red deploy told nobody. #295 and #296 both failed and production sat
      # ~30 hours behind master until #297's deploy happened to succeed, so this
      # reports the outcome to a healthchecks.io check: the plain URL on success,
      # URL/fail otherwise. The check's alert is the notification.
      #
      # Every value reaches the shell through env:, never a ${{ }} inside run:.
      # That keeps the block plain shell -- which is what lets its tests EXTRACT
      # and RUN it, the branch that only fires on an already-failed deploy being
      # exactly the one no green run exercises -- and keeps a secret off a
      # command line.
      - name: Report the deploy outcome
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_DEPLOY_URL }}
          JOB_STATUS: ${{ steps.deploy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$HC_URL" ]; then
            echo "HEALTHCHECKS_DEPLOY_URL is unset; not reporting this deploy"
            exit 0
          fi
          endpoint="$HC_URL"
          if [ "$JOB_STATUS" != "success" ]; then
            endpoint="$HC_URL/fail"
          fi
          # The body shows on the check's timeline, so the alert mail has the run
          # to open. Swallowing curl's status is deliberate: a healthchecks.io
          # outage must not redden a deploy that worked. A permanently broken
          # ping path is caught by the check's own period instead -- no pings at
          # all and the dead-man's-switch fires by itself.
          curl -fsS -m 10 --retry 3 -o /dev/null --data-raw "$RUN_URL" "$endpoint" \
            || echo "healthchecks ping failed; the check's own period is the backstop"
